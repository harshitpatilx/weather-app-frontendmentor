<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png">

  <title>Frontend Mentor | Weather app</title>

  <link rel="stylesheet" href="css/util.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header>
    <div class="logo"><img src="./assets/logo.svg" alt=""></div>
    <button id="unitBtn"> <img src="./assets/icons/icon-units.svg" alt=""> Units <img
        src="./assets/icons/icon-dropdown.svg" alt=""></button>
    <div class="dropdown">
      <div class="drophead">Switch to Imperial/Metric</div>

      <div class="drophead">
        <span class="dropheadTitle">Temperature</span>
        <form action="">
          <input type="radio" id="celcius" name="temperature_unit" value="Celcius" checked>
          <label for="celcius">Celcius (°C)</label><br>
          <input type="radio" id="fahrenheit" name="temperature_unit" value="Fahrenheit">
          <label for="fahrenheit">Fahrenheit (°F)</label><br>
        </form>
      </div>
      <div class="drophead">
        <span class="dropheadTitle">Wind Speed</span>
        <form action="">
          <input type="radio" id="kmph" name="windspeed_unit" value="kmph" checked>
          <label for="kmph">km/h</label><br>
          <input type="radio" id="mph" name="windspeed_unit" value="mph">
          <label for="mph">mph</label><br>
        </form>
      </div>
      <div class="drophead">
        <span class="dropheadTitle">Precipitation</span>
        <form action="">
          <input type="radio" id="millimeter" name="ppt_unit" value="millimeter" checked>
          <label for="millimeter">Millimeters (mm)</label><br>
          <input type="radio" id="inches" name="ppt_unit" value="inches">
          <label for="inches">Inches (in)</label><br>
        </form>
      </div>
    </div>
  </header>

  <section class="masterHeadingSection">
    <h1 class="masterHeading">How's the sky looking today?</h1>
  </section>

  <section class="searchBar">
    <form action="">
      <div class="searchBoxContainer">
        <img src="./assets/icons/icon-search.svg" alt="" for="search">
        <input type="search" name="search" id="search" placeholder="Search for a place...">
      </div>
      <button type="button">Search</button>
    </form>
    <div class="searchResults"></div>
  </section>

  <main>
    <!-- Div 1 -->
    <div class="currentWeather">
      <div class="subBox1">
        <span id="currentLocation"></span>
        <span id="currentDate"></span>
      </div>
      <div class="subBox2">
        <div id='currentTemperature'></div>
      </div>


    </div>
    <!-- Div 2 -->
    <div class="cardFL fhwpCards">
      <span class="fhwpTitle">Feels Like</span>
      <span id="currappTemperature" class="fhwpValues"></span>
    </div>
    <!-- Div 3 -->
    <div class="cardH fhwpCards">
      <span class="fhwpTitle">Humidity</span>
      <span id="currHumidity" class="fhwpValues"></span>
    </div>
    <!-- Div 4 -->
    <div class="cardWS fhwpCards">
      <span class="fhwpTitle">Wind</span>
      <span id="currwindSpeed" class="fhwpValues"></span>
    </div>
    <!-- Div 5 -->
    <div class="cardPPT fhwpCards">
      <span class="fhwpTitle">Precipitation</span>
      <span id="currPpt" class="fhwpValues"></span>
    </div>
    <!-- Div 6 -->
    <div class="dailyForecasts">
      <span class="DFtitle">Daily forecast</span>
      <div class="dayContainer">
        <div class="days">
          <div class="day"> </div>
          <img src="./assets/weather_icons/icon-partly-cloudy.webp" alt="" class="dayWeatherIcon">
          <div class="dayTemp">
            <div class="daylowtemp">20°</div>
            <div class="dayhightemp">14°</div>
          </div>
        </div>
        <div class="days">
          <div class="day"> </div>
          <img src="./assets/weather_icons/icon-partly-cloudy.webp" alt="" class="dayWeatherIcon">
          <div class="dayTemp">
            <div class="daylowtemp">20°</div>
            <div class="dayhightemp">14°</div>
          </div>
        </div>
        <div class="days">
          <div class="day"> </div>
          <img src="./assets/weather_icons/icon-partly-cloudy.webp" alt="" class="dayWeatherIcon">
          <div class="dayTemp">
            <div class="daylowtemp">20°</div>
            <div class="dayhightemp">14°</div>
          </div>
        </div>
        <div class="days">
          <div class="day"> </div>
          <img src="./assets/weather_icons/icon-partly-cloudy.webp" alt="" class="dayWeatherIcon">
          <div class="dayTemp">
            <div class="daylowtemp">20°</div>
            <div class="dayhightemp">14°</div>
          </div>
        </div>
        <div class="days">
          <div class="day"> </div>
          <img src="./assets/weather_icons/icon-partly-cloudy.webp" alt="" class="dayWeatherIcon">
          <div class="dayTemp">
            <div class="daylowtemp">20°</div>
            <div class="dayhightemp">14°</div>
          </div>
        </div>
        <div class="days">
          <div class="day"> </div>
          <img src="./assets/weather_icons/icon-partly-cloudy.webp" alt="" class="dayWeatherIcon">
          <div class="dayTemp">
            <div class="daylowtemp">20°</div>
            <div class="dayhightemp">14°</div>
          </div>
        </div>
        <div class="days">
          <div class="day"> </div>
          <img src="./assets/weather_icons/icon-partly-cloudy.webp" alt="" class="dayWeatherIcon">
          <div class="dayTemp">
            <div class="daylowtemp">20°</div>
            <div class="dayhightemp">14°</div>
          </div>
        </div>
      </div>
    </div>
    <div class="hourlyForecast">
      <div class="hr-section-head">
        <div class="sectionTitle">Hourly forecast</div>
        <div class="daySelector">
          <form action="">
            <select name="days" id="daySelector">
              <option value="monday">Monday</option>
              <option value="tuesday">Tuesday</option>
              <option value="wednesday">Wednesday</option>
              <option value="thursday">Thursday</option>
              <option value="friday">Friday</option>
              <option value="saturday">Saturday</option>
              <option value="sunday">Sunday</option>
            </select>
          </form>
        </div>
      </div>
      <div class="hourCardContainer">
        <div class="hourCard">
          <div class="hourlyWeatherIcon"><img src="./assets/weather_icons/icon-rain.webp" alt=""></div>
          <div class="hour">3 PM</div>
          <div class="hourTemp">20°</div>
        </div>
      </div>
    </div>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="https://github.com/harshitpatilx">Harshit</a>.
  </footer>

  <script src="main.js"></script>
</body>

</html>
